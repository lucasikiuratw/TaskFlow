<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Organize suas tarefas e acompanhe sua produtividade.</p>
    </header>

    <main>

        <section class="resumo">

            <div class="card">
                <h3>Total de tarefas</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Em andamento</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Concluídas</h3>
                <p>0</p>
            </div>

        </section>

        <section class="tarefas">

            <h2>Minhas tarefas</h2>

            <p>Suas atividades aparecerão aqui.</p>

        </section>

    </main>

</body>
</html>
