<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>TaskFlow Pro | Gerenciador de Tarefas</title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>
    <div class="container">


        <header class="header">
            <h1>TaskFlow Pro</h1>
            <p>
                Organize suas tarefas, defina prioridades
                e acompanhe sua produtividade.
            </p>
        </header>


        <section class="dashboard">
            <div class="card">
                <h3>Total de tarefas</h3>
                <span id="totalTasks">0</span>
            </div>


            <div class="card">
                <h3>Em andamento</h3>
                <span id="progressTasks">0</span>
            </div>


            <div class="card">
                <h3>Concluídas</h3>
                <span id="completedTasks">0</span>
            </div>
        </section>


        <section class="task-form">
            <h2>Adicionar nova tarefa</h2>


            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">
                        Nome da tarefa
                    </label>


                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Ex: Estudar Python"
                        required
                        maxlength="150"
                    >
                </div>


                <div class="form-group">
                    <label for="taskDescription">
                        Descrição
                    </label>


                    <textarea
                        id="taskDescription"
                        placeholder="Descreva sua atividade..."
                    ></textarea>
                </div>


                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">
                            Prioridade
                        </label>


                        <select id="taskPriority">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="taskDeadline">
                            Prazo de conclusão
                        </label>


                        <input type="date" id="taskDeadline">
                    </div>
                </div>


                <button type="submit" class="btn-add">
                    + Adicionar tarefa
                </button>
            </form>
        </section>


        <section class="tasks-section">
            <div class="section-heading">
                <h2>Minhas tarefas</h2>


                <div class="filter-box">
                    <label for="taskFilter">
                        Filtrar:
                    </label>


                    <select id="taskFilter">
                        <option value="todas">Todas</option>
                        <option value="pendentes">Em andamento</option>
                        <option value="concluidas">Concluídas</option>
                    </select>
                </div>
            </div>


            <div id="taskList">
                <p class="empty-message">
                    Carregando tarefas...
                </p>
            </div>
        </section>


        <section class="chart-section">
            <h2>Minha produtividade</h2>
            <p>Acompanhe suas tarefas concluídas.</p>


            <div class="chart-container">
                <canvas id="taskChart"></canvas>
            </div>
        </section>


        <footer>
            <p>TaskFlow Pro — Projeto acadêmico</p>
        </footer>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
